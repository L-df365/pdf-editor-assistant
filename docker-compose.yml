version: '3.8'

services:
  pdf-editor:
    build: .
    container_name: pdf-editor-assistant
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ${PWD}:/workspace
    network_mode: host
    privileged: true
